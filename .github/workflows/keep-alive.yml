name: Keep Supabase alive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem atividade.
# Esta rotina faz uma consulta leve ao banco a cada 3 dias para evitar a pausa.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        run: |
          curl -fsS "https://hwvwxvfdfsjcmzinvipy.supabase.co/rest/v1/equipes?select=id&limit=1" \
            -H "apikey: sb_publishable_ptUFiY1lZgmw95pe7N_QvQ_A61XgQU6" \
            -H "Authorization: Bearer sb_publishable_ptUFiY1lZgmw95pe7N_QvQ_A61XgQU6"
